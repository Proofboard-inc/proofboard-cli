name: ci

# Every job here runs on a standard GitHub-hosted runner, which is free with
# unlimited minutes on a public repository — macOS and Windows included. There
# is no cost reason to test this CLI on Linux alone, and it was:  the agent
# service, focus, visibility and workspace-notification code has a separate
# implementation per platform (22 build-tagged files, 14 more branching on
# runtime.GOOS) and none of the Darwin or Windows implementations had their
# tests executed anywhere. Cross-compiling proves they build; only a runner of
# that platform proves they work.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.target }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      # One platform failing must not cancel the others: which platforms fail
      # is the information this matrix exists to produce.
      fail-fast: false
      matrix:
        # Every platform Dartvel publishes a binary for, on its own
        # architecture. ARM is not emulated here — ubuntu-24.04-arm and
        # windows-11-arm are real ARM runners, and macos-latest is Apple
        # Silicon. All are free with unlimited minutes on a public repository.
        #
        # darwin/amd64 has no entry: GitHub has retired its Intel macOS images,
        # and a macos-13 job sat queued for twenty hours waiting for a runner
        # that is never coming, blocking the whole workflow behind it. An
        # unavailable label does not fail — it queues indefinitely, and
        # timeout-minutes does not apply to queue time. Intel Macs are covered
        # by the cross-compile job, which vets and builds that target; if a
        # supported Intel image reappears, add it back here.
        include:
          - os: ubuntu-latest
            target: linux/amd64
          - os: ubuntu-24.04-arm
            target: linux/arm64
          - os: macos-latest
            target: darwin/arm64
          - os: windows-latest
            target: windows/amd64
          - os: windows-11-arm
            target: windows/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # The suite writes to the home directory. On Unix that is HOME; on
      # Windows Go reads USERPROFILE, so a test that sets only HOME would run
      # against the real profile. Point both at a scratch directory so a test
      # cannot leave anything behind on the runner or read the runner's state.
      - name: Isolate the home directory
        shell: bash
        run: |
          scratch="${RUNNER_TEMP}/proofboard-home"
          mkdir -p "$scratch"
          echo "HOME=$scratch" >> "$GITHUB_ENV"
          echo "USERPROFILE=$scratch" >> "$GITHUB_ENV"
          # Only the home directory is redirected here. Setting the product's
          # own switches job-wide — PROOFBOARD_DISABLE_KEYCHAIN in particular —
          # changes the behaviour under test: four tests in internal/auth exist
          # to assert that credentials reach the OS keychain, and they fail
          # against a job that has globally turned it off. Tests that need a
          # switch set it themselves.

      - name: Git identity for repository fixtures
        shell: bash
        run: |
          git config --global user.email ci@proofboard.io
          git config --global user.name "Proofboard CI"
          git config --global init.defaultBranch main

      - name: Confirm the runner is the architecture under test
        shell: bash
        run: |
          # A matrix entry claiming linux/arm64 while running on amd64 would
          # report success for a platform never exercised. Ask Go what it is.
          actual="$(go env GOOS)/$(go env GOARCH)"
          echo "runner reports $actual, matrix expects ${{ matrix.target }}"
          [ "$actual" = "${{ matrix.target }}" ] || {
            echo "::error title=Wrong runner architecture::${{ matrix.os }} reports $actual, not ${{ matrix.target }}"
            exit 1
          }

      - name: Build
        run: go build ./...

      - name: Static analysis
        run: go vet ./...

      - name: Tests
        # -timeout below the default ten minutes: a package that hangs here is
        # waiting on something it will never get (see the auth flow blocking on
        # a browser callback on macOS), and ten minutes per package spent
        # proving that wastes the run.
        run: go test -count=1 -timeout 4m ./...

      # The race detector needs a C toolchain on Windows, which neither Windows
      # runner ships. Naming only windows-latest here left windows-11-arm
      # running it and failing for a reason that has nothing to do with the
      # code. Linux and macOS cover the concurrent paths.
      - name: Race detector
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...

      - name: Compiled executable command surface
        if: runner.os != 'Windows'
        shell: bash
        run: |
          go build -trimpath -o "${RUNNER_TEMP}/proofboard" ./cmd/proofboard
          expected=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/version/version.go)
          scripts/test_compiled_cli.sh "${RUNNER_TEMP}/proofboard" "$expected"

      # The reproduction that matters: install the CLI, open a real
      # interactive shell on this runner, cd into a repository that is not
      # connected, and check the prompt appears. Everything else here tests
      # a piece of that; this tests the thing a developer actually does.
      - name: Auto project detection end to end
        # always(): this is the reproduction being asked for, so it has to run
        # even when an earlier step failed. The suite currently times out on
        # macOS in a package unrelated to detection, and without this the
        # detection result on that platform would never be produced at all.
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          go build -trimpath -o "${RUNNER_TEMP}/pb" ./cmd/proofboard
          # zsh is the macOS default shell and bash the Linux one; both are
          # present on these images, so both get exercised everywhere.
          sh scripts/test_detection_e2e.sh "${RUNNER_TEMP}/pb" bash zsh

      - name: Auto project detection end to end (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -trimpath -o "$env:RUNNER_TEMP\pb.exe" ./cmd/proofboard
          # Both installation methods and both shells, because they are
          # genuinely different code paths: the MSI and setup.exe run
          # `agent enable` rather than `proofboard install`, and Windows
          # PowerShell 5.1 reads a different profile from PowerShell 7.
          # Every combination is run before the step fails, so one broken
          # combination does not hide the state of the other three.
          $failed = @()
          foreach ($method in 'install', 'agent-enable') {
            foreach ($sh in 'pwsh', 'powershell') {
              & ./scripts/test_detection_e2e.ps1 -Binary "$env:RUNNER_TEMP\pb.exe" -Method $method -Shell $sh
              if ($LASTEXITCODE -ne 0) { $failed += "$method/$sh" }
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error ("detection failed for: " + ($failed -join ', '))
            exit 1
          }

      - name: Compiled executable command surface (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -trimpath -o "$env:RUNNER_TEMP\proofboard.exe" ./cmd/proofboard
          $expected = (Select-String -Path internal/version/version.go -Pattern '^const Version = "(.*)"').Matches[0].Groups[1].Value
          # Joined first: PowerShell hands back multi-line output as a string
          # array, and -notmatch over an array FILTERS it rather than testing
          # the whole thing — so a run that also printed "Dictionary updated
          # successfully" failed this check even though the version line was
          # right there in the output.
          $actual = (& "$env:RUNNER_TEMP\proofboard.exe" version) -join ' '
          if ($actual -notmatch [regex]::Escape($expected)) {
            Write-Error "version reported '$actual', expected it to contain '$expected'"
            exit 1
          }
          # A command that cannot show help is broken however well it compiles.
          & "$env:RUNNER_TEMP\proofboard.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error 'proofboard --help failed'; exit 1 }
          Write-Output "compiled executable reports $actual"

  cross-compile:
    name: cross-compile every release target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build and vet each target
        run: |
          set -eu
          # vet, not just build: build alone misses problems vet catches in the
          # per-platform files, and those files are only ever compiled under
          # their own GOOS.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos=${target%/*}; goarch=${target#*/}
            echo "--- $goos/$goarch"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go vet ./...
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath -o /dev/null ./cmd/proofboard
          done

  scripts:
    name: shell, PowerShell and packaging scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Shell scripts parse
        run: |
          sh -n scripts/install.sh build/install.sh \
            scripts/package_linux_deb.sh scripts/package_linux_rpm.sh \
            scripts/package_linux_appimage.sh scripts/package_macos_pkg.sh \
            scripts/package_macos_dmg.sh scripts/test_compiled_cli.sh \
            scripts/test_no_system_pollution.sh scripts/test_agent_reinstall.sh \
            scripts/release_assets.sh scripts/test_package_arch.sh \
            scripts/test_detection_e2e.sh
          bash -n scripts/publish_release.sh

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          if (-not (Select-String -Path scripts/install.cmd -SimpleMatch -Quiet 'install.ps1')) {
            Write-Error 'install.cmd no longer launches install.ps1'
            exit 1
          }

      - name: npm launcher tests
        run: npm --prefix npm-package test

      - name: Linux packages declare and carry the right architecture
        run: |
          # The tools below come from github.com releases, so this step depends
          # on someone else being up. A 502 fetching appimagetool failed a run
          # that had nothing wrong with it, hence --retry on both downloads.
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm libfuse2 file
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o /tmp/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o /tmp/runtime-aarch64 \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-aarch64
          APPIMAGETOOL=/tmp/appimagetool APPIMAGE_RUNTIME=/tmp/runtime-aarch64 \
            sh scripts/test_package_arch.sh
