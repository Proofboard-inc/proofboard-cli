name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unit and integration tests without system pollution
        run: scripts/test_no_system_pollution.sh go test -count=1 -coverprofile=coverage.out ./...
      - name: Race detector without system pollution
        run: scripts/test_no_system_pollution.sh go test -race -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: Test npm Career Agent wrapper
        run: npm --prefix npm-package test
      - name: Validate installer and release scripts
        run: |
          sh -n scripts/install.sh build/install.sh scripts/package_linux_deb.sh scripts/package_linux_rpm.sh scripts/package_linux_appimage.sh scripts/package_macos_pkg.sh scripts/package_macos_dmg.sh scripts/test_compiled_cli.sh scripts/test_no_system_pollution.sh scripts/test_agent_reinstall.sh
          bash -n scripts/publish_release.sh
      - name: Validate the Windows installer scripts
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          if (-not (Select-String -Path scripts/install.cmd -SimpleMatch -Quiet 'install.ps1')) {
            Write-Error 'install.cmd no longer launches install.ps1'
            exit 1
          }
      - name: Build and test the compiled executable command surface
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/proofboard-compiled ./cmd/proofboard
          EXPECTED_VERSION=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/version/version.go)
          scripts/test_compiled_cli.sh /tmp/proofboard-compiled "$EXPECTED_VERSION"
          scripts/test_agent_reinstall.sh /tmp/proofboard-compiled

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: proofboard-linux-amd64
          - goos: darwin
            goarch: amd64
            output: proofboard-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: proofboard-darwin-arm64
          - goos: windows
            goarch: amd64
            output: proofboard-windows-amd64.exe
          # Single-board machines and ARM cloud instances for Linux; the
          # Surface and Snapdragon laptops for Windows. Both are pure static
          # cross-compiles with CGO off, so they cost a build slot and nothing
          # else — while without them those developers get a hard refusal.
          - goos: linux
            goarch: arm64
            output: proofboard-linux-arm64
          - goos: windows
            goarch: arm64
            output: proofboard-windows-arm64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Build static Career Agent
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.output }}" ./cmd/proofboard
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error

  installer-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: proofboard-linux-amd64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: proofboard-linux-arm64
          path: dist
      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm libfuse2 file || true
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          # appimagetool embeds the runtime of its own architecture, so an
          # aarch64 AppImage needs the aarch64 runtime supplied explicitly.
          # Without it the build reports success and produces a file with an
          # x86-64 runtime that cannot start on an ARM machine.
          curl -fsSL -o /tmp/runtime-aarch64 \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-aarch64
      - name: Build the Linux packages
        run: |
          set -eu
          # Debian, RPM and AppImage each spell the architectures differently.
          for triple in "amd64 amd64 x86_64" "arm64 arm64 aarch64"; do
            set -- $triple
            GO_ARCH=$1; DEB_ARCH=$2; RPM_ARCH=$3
            BIN="dist/proofboard-linux-${GO_ARCH}"
            OUT="dist/Proofboard-Career-Agent-linux-${GO_ARCH}"
            chmod +x "$BIN"

            scripts/package_linux_deb.sh "${GITHUB_REF_NAME}" "$BIN" "${OUT}.deb" "$DEB_ARCH"
            dpkg-deb --info "${OUT}.deb"
            test "$(dpkg-deb -f "${OUT}.deb" Architecture)" = "$DEB_ARCH"

            scripts/package_linux_rpm.sh "${GITHUB_REF_NAME}" "$BIN" "${OUT}.rpm" "$RPM_ARCH"
            rpm -qip "${OUT}.rpm"
            test "$(rpm -qp --qf '%{ARCH}' "${OUT}.rpm")" = "$RPM_ARCH"
            # The payload must be the binary we signed, so confirm it is in there.
            rpm -qlp "${OUT}.rpm" | grep -qx /usr/bin/proofboard

            if [ "$GO_ARCH" = "arm64" ]; then
              RUNTIME=/tmp/runtime-aarch64
            else
              RUNTIME=
            fi
            APPIMAGETOOL=/tmp/appimagetool APPIMAGE_RUNTIME="$RUNTIME" \
              scripts/package_linux_appimage.sh \
                "${GITHUB_REF_NAME}" "$BIN" "${OUT}.AppImage" "$RPM_ARCH"
            test -s "${OUT}.AppImage"
            chmod +x "${OUT}.AppImage"
          done
          # An AppImage that cannot run is not a release artifact, so run the
          # one this runner can execute. The aarch64 build cannot run here;
          # package_linux_appimage.sh verifies its embedded runtime instead.
          ./dist/Proofboard-Career-Agent-linux-amd64.AppImage --appimage-extract-and-run version
      - uses: actions/upload-artifact@v4
        with:
          name: proofboard-career-agent-linux-packages
          path: |
            dist/Proofboard-Career-Agent-linux-amd64.deb
            dist/Proofboard-Career-Agent-linux-amd64.rpm
            dist/Proofboard-Career-Agent-linux-amd64.AppImage
            dist/Proofboard-Career-Agent-linux-arm64.deb
            dist/Proofboard-Career-Agent-linux-arm64.rpm
            dist/Proofboard-Career-Agent-linux-arm64.AppImage
          if-no-files-found: error

  installer-macos:
    needs: build
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            binary: proofboard-darwin-amd64
            installer: Proofboard-Career-Agent-darwin-amd64.pkg
          - arch: arm64
            binary: proofboard-darwin-arm64
            installer: Proofboard-Career-Agent-darwin-arm64.pkg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: dist
      - name: Sign the executable for macOS
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_APP: ${{ secrets.APPLE_DEVELOPER_ID_APP }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ]; then
            # Skipped, and said out loud. A signing step that reports success
            # while doing nothing is how a release ships unsigned without
            # anyone noticing, so this always prints and the release notes
            # carry the caveat.
            echo "::warning title=macOS signing skipped::APPLE_CERTIFICATE_P12 is not set. macOS will refuse to open this download: 'the developer cannot be verified'. See docs/code-signing.md."
            exit 0
          fi
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          chmod +x "dist/${{ matrix.binary }}"
          # --options runtime is required for notarization to be accepted.
          codesign --force --timestamp --options runtime \
            --sign "$APPLE_DEVELOPER_ID_APP" "dist/${{ matrix.binary }}"
          codesign --verify --strict --verbose=2 "dist/${{ matrix.binary }}"
          # Kept under a distinct name so it does not collide with the build
          # job's upload of the same filename. The publish job moves it into
          # place, otherwise the standalone executable on the release would be
          # the unsigned one while only the package contained a signed copy.
          cp "dist/${{ matrix.binary }}" "dist/${{ matrix.binary }}.codesigned"

      - name: Build double-click macOS installer
        run: |
          chmod +x "dist/${{ matrix.binary }}"
          scripts/package_macos_pkg.sh "${GITHUB_REF_NAME}" "dist/${{ matrix.binary }}" "dist/${{ matrix.installer }}"
          pkgutil --payload-files "dist/${{ matrix.installer }}" | grep 'usr/local/bin/proofboard'
          pkgutil --expand "dist/${{ matrix.installer }}" expanded-package
          sh -n expanded-package/Scripts/postinstall
          grep -q 'proofboard agent enable' expanded-package/Scripts/postinstall
      - name: Build the disk image
        run: |
          scripts/package_macos_dmg.sh "${GITHUB_REF_NAME}" \
            "dist/${{ matrix.binary }}" "dist/${{ matrix.installer }}" \
            "dist/Proofboard-Career-Agent-darwin-${{ matrix.arch }}.dmg"
          # Mount it and confirm the executable is really inside, rather than
          # trusting that hdiutil exited zero.
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/pbdmg \
            "dist/Proofboard-Career-Agent-darwin-${{ matrix.arch }}.dmg"
          # -srcfolder copies the folder CONTENTS to the volume root, so the
          # executable sits at the top level rather than in a nested folder.
          ls /tmp/pbdmg/proofboard
          ls /tmp/pbdmg/*.pkg
          hdiutil detach /tmp/pbdmg
      - name: Sign and notarize the macOS packages
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_DEVELOPER_ID_APP: ${{ secrets.APPLE_DEVELOPER_ID_APP }}
          APPLE_DEVELOPER_ID_INSTALLER: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ]; then
            echo "::warning title=macOS packages unsigned::Package and disk image are not signed or notarized. See docs/code-signing.md."
            exit 0
          fi
          PKG="dist/${{ matrix.installer }}"
          DMG="dist/Proofboard-Career-Agent-darwin-${{ matrix.arch }}.dmg"
          # An installer package is signed with the Installer identity, not
          # the Application one; using the wrong identity fails at install.
          productsign --sign "$APPLE_DEVELOPER_ID_INSTALLER" "$PKG" "$PKG.signed"
          mv "$PKG.signed" "$PKG"
          codesign --force --timestamp --sign "$APPLE_DEVELOPER_ID_APP" "$DMG"

          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::warning title=Notarization skipped::Signed but not notarized. Gatekeeper still blocks a downloaded file without notarization, so this is not enough on its own."
            exit 0
          fi
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/key.p8"
          for f in "$PKG" "$DMG"; do
            xcrun notarytool submit "$f" --key "$RUNNER_TEMP/key.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
            # Stapling attaches the ticket so the file validates offline.
            xcrun stapler staple "$f"
            xcrun stapler validate "$f"
          done
          rm -f "$RUNNER_TEMP/key.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: proofboard-career-agent-darwin-${{ matrix.arch }}-packages
          path: |
            dist/${{ matrix.binary }}.codesigned
            dist/${{ matrix.installer }}
            dist/Proofboard-Career-Agent-darwin-${{ matrix.arch }}.dmg
          if-no-files-found: error

  installer-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: proofboard-windows-amd64.exe
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: proofboard-windows-arm64.exe
          path: dist
      - name: Install Inno Setup and the WiX Toolset
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          choco install wixtoolset --no-progress -y
      - name: Build double-click Windows installers
        shell: pwsh
        run: |
          # ARM64 Windows laptops run the x64 build under emulation, but a
          # native package is faster and is what the CLI's own updater will
          # fetch, so both architectures get the full set of installers.
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $output = (Resolve-Path 'dist').Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # Go's architecture names and Inno's are not the same vocabulary.
          $arches = @(
            @{ Go = 'amd64'; Inno = 'x64compatible' },
            @{ Go = 'arm64'; Inno = 'arm64' }
          )
          foreach ($a in $arches) {
            $binary = (Resolve-Path "dist/proofboard-windows-$($a.Go).exe").Path
            & $iscc "/DBinaryPath=$binary" "/DMyAppVersion=$version" "/DInstallerOutputDir=$output" `
              "/DTargetArch=$($a.Go)" "/DInnoArch=$($a.Inno)" 'packaging/windows/ProofboardCareerAgent.iss'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $setup = "dist/Proofboard-Career-Agent-windows-$($a.Go)-setup.exe"
            if (-not (Test-Path $setup)) { Write-Error "installer not produced: $setup"; exit 1 }
          }
      - name: Build the MSI packages
        shell: pwsh
        run: |
          # Managed Windows fleets deploy MSI through Group Policy and Intune,
          # neither of which can consume the Inno .exe, so both ship.
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $wix = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (-not (Test-Path $wix)) { $wix = (Get-ChildItem "${env:ProgramFiles(x86)}" -Filter 'candle.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).DirectoryName }
          # The licence shown on the first dialog. Checked in as RTF rather
          # than converted from LICENSE at build time: escaping backslashes
          # and braces through PowerShell into RTF is easy to get subtly
          # wrong, and a malformed licence page fails the whole install.
          $licenseRtf = (Resolve-Path 'packaging/windows/license.rtf').Path

          # candle's -arch values are x64 and arm64; Go says amd64 and arm64.
          $arches = @(
            @{ Go = 'amd64'; Wix = 'x64' },
            @{ Go = 'arm64'; Wix = 'arm64' }
          )
          foreach ($a in $arches) {
            $binary = (Resolve-Path "dist/proofboard-windows-$($a.Go).exe").Path
            $msi = "dist\Proofboard-Career-Agent-windows-$($a.Go).msi"
            & "$wix\candle.exe" -nologo -arch $a.Wix "-dProductVersion=$version" "-dBinaryPath=$binary" "-dLicenseRtf=$licenseRtf" `
              -ext WixUIExtension -out "dist\proofboard-$($a.Go).wixobj" packaging\windows\proofboard.wxs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # -ext WixUIExtension is what links the dialog set in. Without it the
            # package builds and installs but shows nothing at all.
            & "$wix\light.exe" -nologo -ext WixUIExtension -out $msi "dist\proofboard-$($a.Go).wixobj"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Test-Path $msi)) { Write-Error "MSI not produced: $msi"; exit 1 }

            # An installer that shows no dialogs looks like it did nothing, so
            # confirm the dialog table actually has rows rather than trusting
            # that the build succeeded. Note that Windows Installer SQL has no
            # COUNT(*): asking for one fails the query rather than returning a
            # number, which is how this check first reported a problem that was
            # entirely its own.
            $msiPath = (Resolve-Path $msi).Path
            $installer = New-Object -ComObject WindowsInstaller.Installer
            $db = $installer.GetType().InvokeMember('OpenDatabase','InvokeMethod',$null,$installer,@($msiPath,0))
            $view = $db.GetType().InvokeMember('OpenView','InvokeMethod',$null,$db,@('SELECT Dialog FROM Dialog'))
            $view.GetType().InvokeMember('Execute','InvokeMethod',$null,$view,$null)
            $first = $view.GetType().InvokeMember('Fetch','InvokeMethod',$null,$view,$null)
            if ($null -eq $first) {
              Write-Error "MSI contains no dialogs; it would install silently and appear to do nothing: $msi"
              exit 1
            }
            $name = $first.GetType().InvokeMember('StringData','GetProperty',$null,$first,1)
            Write-Output "MSI user interface present in $msi (first dialog: $name)"
          }

      - name: Build the MSIX packages
        shell: pwsh
        run: |
          # MSIX is what the Store and modern Intune deployment consume. These
          # packages are UNSIGNED: Windows will only install them on a machine
          # with developer mode on, or after they are signed with a trusted
          # certificate. They ship so that anyone with a certificate can sign
          # and deploy without rebuilding.
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $sdk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter 'makeappx.exe' -Recurse -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -like '*x64*' } | Select-Object -First 1
          if (-not $sdk) { Write-Error 'makeappx.exe not found in the Windows SDK'; exit 1 }
          # MSIX requires a four-part version whose last part is 0.
          $manifestVersion = "$version.0"
          # The manifest's ProcessorArchitecture must match the binary inside,
          # or Windows refuses the package on the machine it was built for.
          $arches = @(
            @{ Go = 'amd64'; Msix = 'x64' },
            @{ Go = 'arm64'; Msix = 'arm64' }
          )
          foreach ($a in $arches) {
            $stage = "dist\msix-$($a.Go)"
            New-Item -ItemType Directory -Force -Path "$stage\Assets" | Out-Null
            Copy-Item "dist/proofboard-windows-$($a.Go).exe" "$stage\proofboard.exe"
            (Get-Content 'packaging/windows/AppxManifest.xml') `
              -replace 'PLACEHOLDER_VERSION', $manifestVersion `
              -replace 'PLACEHOLDER_ARCH', $a.Msix |
              Set-Content "$stage\AppxManifest.xml"
            # Minimal valid PNGs so the manifest's asset references resolve.
            $png = [Convert]::FromBase64String('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==')
            foreach ($n in 'StoreLogo.png','Square150x150Logo.png','Square44x44Logo.png') {
              [IO.File]::WriteAllBytes((Join-Path (Resolve-Path "$stage\Assets") $n), $png)
            }
            $msix = "dist\Proofboard-Career-Agent-windows-$($a.Go).msix"
            & $sdk.FullName pack /d $stage /p $msix /o
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Test-Path $msix)) { Write-Error "MSIX not produced: $msix"; exit 1 }
          }

      - name: Sign the Windows executables and packages
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX) {
            # Skipped loudly on purpose. Unsigned, SmartScreen warns on the
            # .exe and .msi, and the .msix cannot be installed at all.
            Write-Output "::warning title=Windows signing skipped::WINDOWS_CERTIFICATE_PFX is not set. SmartScreen will warn on the installers and the MSIX cannot be installed. See docs/code-signing.md."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter 'signtool.exe' -Recurse -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -like '*x64*' } | Select-Object -First 1
          if (-not $signtool) { Write-Error 'signtool.exe not found'; exit 1 }

          # The MSIX must be signed by the same identity its manifest declares
          # as Publisher, or Windows rejects it at install with a mismatch.
          $targets = @()
          foreach ($arch in @('amd64','arm64')) {
            $targets += "dist/proofboard-windows-$arch.exe"
            $targets += "dist/Proofboard-Career-Agent-windows-$arch-setup.exe"
            $targets += "dist/Proofboard-Career-Agent-windows-$arch.msi"
            $targets += "dist/Proofboard-Career-Agent-windows-$arch.msix"
          }
          foreach ($t in $targets) {
            if (-not (Test-Path $t)) { Write-Error "missing $t"; exit 1 }
            # A timestamp keeps the signature valid after the certificate
            # expires; without it every signed file goes untrusted on expiry.
            & $signtool.FullName sign /fd SHA256 /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD $t
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $signtool.FullName verify /pa $t
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item $pfx -Force
          # As with macOS: hand the signed executables back under distinct
          # names so publish can replace the unsigned ones from the build job.
          foreach ($arch in @('amd64','arm64')) {
            Copy-Item "dist/proofboard-windows-$arch.exe" "dist/proofboard-windows-$arch.exe.codesigned" -Force
          }

      - uses: actions/upload-artifact@v4
        with:
          name: proofboard-career-agent-windows-packages
          path: |
            dist/proofboard-windows-amd64.exe.codesigned
            dist/proofboard-windows-arm64.exe.codesigned
            dist/Proofboard-Career-Agent-windows-amd64-setup.exe
            dist/Proofboard-Career-Agent-windows-amd64.msi
            dist/Proofboard-Career-Agent-windows-amd64.msix
            dist/Proofboard-Career-Agent-windows-arm64-setup.exe
            dist/Proofboard-Career-Agent-windows-arm64.msi
            dist/Proofboard-Career-Agent-windows-arm64.msix
          if-no-files-found: error

  publish:
    needs: [build, installer-linux, installer-macos, installer-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Promote code-signed executables
        run: |
          # The installer jobs code-sign for macOS and Windows. Those signed
          # copies arrive under a .codesigned suffix so they do not collide
          # with the build job's upload of the same name; move them into place
          # now, before the release key signs whatever is on disk. Without
          # this the release would carry unsigned standalone executables while
          # the installers contained signed ones.
          shopt -s nullglob
          for f in dist/*.codesigned; do
            target="${f%.codesigned}"
            mv "$f" "$target"
            echo "promoted $(basename "$target") to the code-signed build"
          done

      - name: Publish the executables under the product name
        run: |
          # Every installer on the release page is named for the product, so
          # the bare executables carry that name too — and the lowercase names
          # are published alongside them rather than replaced.
          #
          # releases.proofboard.io now asks for the product name and translates
          # the lowercase one, so the public install path no longer depends on
          # these. What still does is an installed copy of 1.13.2 or earlier:
          # it builds the lowercase name, looks for it in the GitHub release's
          # own asset list, and fails outright when it is absent. Those copies
          # never touch releases.proofboard.io, so nothing that host does can
          # cover them — dropping these names strands those users with no way
          # to update short of reinstalling by hand.
          #
          # Both names are the same bytes and both are signed.
          cd dist
          # Both lists are generated from the same matrix in the same order,
          # so pairing them line by line cannot mismatch a platform.
          sh ../scripts/release_assets.sh legacy > legacy.list
          sh ../scripts/release_assets.sh binaries > product.list
          paste legacy.list product.list | while IFS="$(printf '\t')" read -r legacy product; do
            cp "$legacy" "$product"
            echo "published $legacy as $product"
          done
          rm -f legacy.list product.list

      - name: Sign and verify update binaries
        env:
          PROOFBOARD_RELEASE_PRIVATE_KEY: ${{ secrets.PROOFBOARD_RELEASE_PRIVATE_KEY }}
        run: |
          test -n "$PROOFBOARD_RELEASE_PRIVATE_KEY"
          SIGNING_KEY_FILE=$(mktemp)
          trap 'shred -u "$SIGNING_KEY_FILE"' EXIT
          printf '%s\n' "$PROOFBOARD_RELEASE_PRIVATE_KEY" > "$SIGNING_KEY_FILE"
          chmod 0600 "$SIGNING_KEY_FILE"
          # The set of signed artifacts comes from scripts/release_assets.sh so
          # that signing, checksums, the verify matrix and the upload cannot
          # disagree about what a release contains.
          for binary in $(sh scripts/release_assets.sh signed)
          do
            go run scripts/sign.go "$SIGNING_KEY_FILE" "dist/$binary"
            go run ./scripts/verify_signature "dist/$binary" "dist/$binary.sig"
          done
          PROOFBOARD_LATEST_RELEASE_URL=file:///dev/null \
            PROOFBOARD_DOWNLOAD_BASE_URL="file://${PWD}/dist" \
            PROOFBOARD_INSTALL_VERIFY_ONLY=1 \
            scripts/test_no_system_pollution.sh scripts/install.sh
      # Asset naming, which is deliberate rather than accidental:
      #
      #   proofboard-<goos>-<goarch>[.exe]      the raw executable, plus .sig
      #   Proofboard-Career-Agent-<os>-<arch>.<ext>   an installer package
      #
      # The lowercase names are load-bearing and must not be renamed: every
      # installed copy builds that exact filename to find its own update
      # (see install.sh and internal/commands/update.go, which fails outright
      # when the asset is absent), so renaming them breaks self-update for
      # everyone already on an older version. The product-named files are
      # read only by people, so they carry the full product name and stay
      # consistent on <os>-<arch> across every packaging format.
      - name: Verify complete release matrix
        run: |
          # Every artifact the release claims to publish must exist before the
          # release is created. Previously this was a hand-written list that
          # drifted from the one used to upload, so a target could be missing
          # from the release page while this step still passed.
          missing=0
          for asset in $(sh scripts/release_assets.sh signed) \
                       $(sh scripts/release_assets.sh signatures) \
                       $(sh scripts/release_assets.sh installers); do
            if [ ! -f "dist/$asset" ]; then
              echo "missing release artifact: $asset" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "all $(sh scripts/release_assets.sh signed | wc -l) executables and $(sh scripts/release_assets.sh installers | wc -l) installers present"
      - name: Stamp the installer fallback version
        run: |
          # The installers carry a pinned version used only when neither
          # latest.json nor the GitHub API can be reached. Hand-maintained it
          # goes stale silently — it sat at v1.10.0 across four releases,
          # which would have installed a downgrade on any machine that hit
          # the fallback path. Stamping it here means it cannot drift again.
          TAG="${GITHUB_REF_NAME}"
          sed -i "s/^PINNED_VERSION=\".*\"$/PINNED_VERSION=\"${TAG}\"/" scripts/install.sh
          sed -i "s/^\$PinnedVersion = '.*'$/\$PinnedVersion = '${TAG}'/" scripts/install.ps1
          grep -q "PINNED_VERSION=\"${TAG}\"" scripts/install.sh
          grep -q "PinnedVersion = '${TAG}'" scripts/install.ps1
          echo "installer fallback pinned to ${TAG}"

      - name: Stage installers
        run: |
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          cp scripts/install.cmd dist/install.cmd
          # Windows treats .bat and .cmd the same, but people look for
          # install.bat, so both are published rather than expecting anyone to
          # know they are equivalent.
          cp scripts/install.cmd dist/install.bat
          # The npm package bundles the executables under the lowercase names
          # its launcher looks for internally, while the release assets carry
          # the product name. Copy across, translating the name.
          mkdir -p npm-package/vendor
          for bundled in proofboard-linux-amd64 proofboard-darwin-amd64 proofboard-darwin-arm64 proofboard-windows-amd64.exe; do
            asset="Proofboard-Career-Agent-${bundled#proofboard-}"
            cp "dist/$asset" "npm-package/vendor/$bundled"
            cp "dist/$asset.sig" "npm-package/vendor/$bundled.sig"
          done
          npm pack ./npm-package --pack-destination dist
          test -n "$(find dist -maxdepth 1 -type f -name 'proofboard-cli-*.tgz' -print -quit)"
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          printf '{"version":"%s","url":"https://proofboard.io/%s"}\n' \
            "$RELEASE_VERSION" "$GITHUB_REF_NAME" > dist/latest.json
          cd dist
          # Derived from scripts/release_assets.sh rather than hand-listed. A
          # checksums file missing the very downloads people verify still
          # looks complete, which is how v1.16.0 shipped binaries that every
          # install downloaded successfully and then refused to verify.
          # shellcheck disable=SC2046 # the asset list is deliberately split
          sha256sum $(sh ../scripts/release_assets.sh checksums) proofboard-cli-*.tgz > checksums.txt

          for required in $(sh ../scripts/release_assets.sh signed); do
            grep -q " ${required}$" checksums.txt || {
              echo "checksums.txt is missing ${required}" >&2
              exit 1
            }
            grep -q " ${required}.sig$" checksums.txt || {
              echo "checksums.txt is missing ${required}.sig" >&2
              exit 1
            }
          done
          for required in $(sh ../scripts/release_assets.sh installers); do
            grep -q " ${required}$" checksums.txt || {
              echo "checksums.txt is missing ${required}" >&2
              exit 1
            }
          done
          echo "checksums.txt covers $(wc -l < checksums.txt) files"
      - name: Stage the release assets
        run: |
          # Copy exactly what scripts/release_assets.sh declares into one
          # directory and upload that directory. The upload can then not
          # disagree with the manifest, and a missing artifact fails here
          # rather than producing a release that is quietly incomplete.
          mkdir -p dist/release
          cd dist
          for asset in $(sh ../scripts/release_assets.sh all) checksums.txt; do
            test -f "$asset" || { echo "missing release asset: $asset" >&2; exit 1; }
            cp "$asset" release/
          done
          cp proofboard-cli-*.tgz release/
          echo "staged $(find release -type f | wc -l) release assets"
      - uses: softprops/action-gh-release@v2
        with:
          name: Proofboard Career Agent ${{ github.ref_name }}
          body: |
            Proofboard builds your career while you focus on building software.

            Highlights:
            - Installing from the published one-line command actually completes now. v1.16.0 fixed the download itself (a 404 from a renamed asset), but checksums.txt — a hand-maintained list — was never updated to include the restored names, so every install still failed one step later at signature/checksum verification. Both naming conventions are covered now for every target, including the new ARM builds.

            No other code changes ride with this — it exists so there is a release that installs cleanly end to end.

            Built for six targets with every native installer, install script, metadata file, and npm tarball attached. Operating-system code signing runs automatically once the certificates in docs/code-signing.md are configured; until then the signing steps skip and say so, and this release is unsigned.

          files: dist/release/*
          fail_on_unmatched_files: true

  publish-download-host:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Copy the release artifacts into the download host
        env:
          RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # releases.proofboard.io serves /latest/<name> from its own repo so a
          # download does not depend on GitHub being reachable. Those files are
          # this release's artifacts, so they are replaced here rather than by
          # hand — a host still serving the previous release's binaries is the
          # failure this exists to prevent.
          if [ -z "${RELEASES_REPO_TOKEN}" ]; then
            echo "::error title=Download host not updated::RELEASES_REPO_TOKEN is not set, so releases.proofboard.io still serves the previous release's artifacts AND its latest.json, meaning it reports the wrong version to everything that asks. verify-download-host will fail this release for that reason. Pinned-version URLs and the GitHub redirect still work."
            exit 0
          fi

          TAG="${GITHUB_REF_NAME}"
          git config --global user.name "proofboard-release"
          git config --global user.email "release@proofboard.io"
          git clone --depth 1 \
            "https://x-access-token:${RELEASES_REPO_TOKEN}@github.com/Proofboard-inc/proofboard-releases.git" host
          cd host

          # Replaced wholesale, not merged: an artifact dropped from a later
          # release must not linger here pretending to be current.
          rm -rf public/latest
          mkdir -p public/latest
          cd public/latest
          gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" --clobber

          # Verify before publishing. These files are what people download, so
          # a corrupted copy here is worse than no copy at all.
          failed=0
          while read -r sum name; do
            [ -f "$name" ] || { echo "missing $name" >&2; failed=1; continue; }
            actual=$(sha256sum < "$name" | awk '{print $1}')
            [ "$actual" = "$sum" ] || { echo "checksum mismatch for $name" >&2; failed=1; }
          done < checksums.txt
          [ "$failed" -eq 0 ] || { echo "::error title=Corrupt artifact::A downloaded artifact did not match checksums.txt"; exit 1; }
          echo "verified $(wc -l < checksums.txt) artifacts"

          cat > README.md <<'DOC'
          # Release artifacts

          Every artifact from the current Proofboard CLI release, served
          directly at `https://releases.proofboard.io/latest/<name>` rather
          than redirected to GitHub.

          These files are generated by the release workflow. Do not edit them
          by hand — they are replaced wholesale on each release and verified
          against the release's own `checksums.txt`.
          DOC

          cd ..
          # Also serve every artifact from the public root. Git stores one blob
          # per identical file, so carrying them at both paths costs nothing.
          #
          # Everything is overwritten, install.sh, install.ps1 and latest.json
          # included: cutting a release is what makes those files current, so
          # the host must carry the release's copies rather than older ones it
          # happens to be holding. The release's install.sh is also the better
          # installer — it verifies the release signature, installs per-user
          # without sudo, and registers the background agent.
          #
          # Old artifacts are cleared first for the same reason public/latest is
          # replaced rather than merged: an artifact dropped from a later
          # release must not sit here still being served as though it were
          # current.
          for existing in *; do
            [ -f "$existing" ] && rm -f "$existing"
          done
          for artifact in latest/*; do
            name=$(basename "$artifact")
            [ "$name" = "README.md" ] && continue
            cp "$artifact" "$name"
          done

          cd ..
          git add -A public
          if git diff --cached --quiet; then
            echo "download host already serving ${TAG}"
            exit 0
          fi
          git commit -q -m "Serve ${TAG} artifacts"
          git push -q origin HEAD
          echo "download host updated to ${TAG}"

  verify-download-host:
    needs: [publish, publish-download-host]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every artifact must resolve through releases.proofboard.io
        run: |
          # The release page having a file is not the same as people being
          # able to get it. releases.proofboard.io is the host the public
          # one-line install and every download button point at, and it has
          # served a 404 for a platform that was sitting on the release page
          # the whole time. Ask the host for every artifact and fail the
          # release if any of them cannot be fetched.
          HOST=https://releases.proofboard.io
          TAG="${GITHUB_REF_NAME}"

          # The host resolves "latest" from the GitHub API, which can lag a
          # few seconds behind the release being created.
          for attempt in $(seq 1 20); do
            # The host now serves the release's own latest.json, which spells
            # the version without the leading v that the tag carries. Compare
            # the bare versions so this is not a permanent false mismatch.
            seen=$(curl -fsS --max-time 20 "$HOST/latest.json" | sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p')
            [ "${seen#v}" = "${TAG#v}" ] && break
            echo "waiting for the host to see $TAG (currently ${seen:-unknown})"
            sleep 15
          done
          [ "${seen#v}" = "${TAG#v}" ] || {
            echo "::error title=Download host stale::releases.proofboard.io reports ${seen:-unknown}, not $TAG. If publish-download-host skipped, set the RELEASES_REPO_TOKEN secret: the host now serves its own copy of latest.json, so a host left behind reports the wrong version to everything that asks."
            exit 1
          }

          failed=0
          for asset in $(sh scripts/release_assets.sh all) checksums.txt; do
            # Ask for the first byte only. Fetching each artifact in full would
            # pull most of a gigabyte through this job to learn nothing the
            # first byte does not already tell us: that the name resolves and
            # the download host will serve it. A range request answers 206,
            # and a host that ignores the range answers 200.
            code=$(curl -s -o /dev/null -L --max-time 60 -r 0-0 -w '%{http_code}' "$HOST/$TAG/$asset")
            case "$code" in
              200|206) ;;
              *) echo "  $code  $asset"; failed=1 ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error title=Artifacts unreachable::Some release artifacts do not resolve through $HOST"
            exit 1
          fi
          echo "every artifact resolves through $HOST for $TAG"

          # The install one-liner is the path most people take, so exercise it
          # rather than assuming it follows from the artifacts existing.
          curl -fsSL "$HOST/install.sh" -o /tmp/install.sh
          sh -n /tmp/install.sh

  publish-npm:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - name: Verify npm package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./npm-package/package.json').version")
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"
      - run: npm --prefix npm-package test
      - name: Stage signed release binaries in npm package
        run: |
          # Release assets are named for the product; the package bundles them
          # under the lowercase names its launcher looks for internally. The
          # two are not interchangeable, so the download is translated rather
          # than copied. This step asked for the old asset names after they
          # were renamed and failed the job outright.
          mkdir -p npm-package/vendor
          for bundled in proofboard-linux-amd64 proofboard-darwin-amd64 proofboard-darwin-arm64 proofboard-windows-amd64.exe; do
            asset="Proofboard-Career-Agent-${bundled#proofboard-}"
            gh release download "${GITHUB_REF_NAME}" \
              --pattern "${asset}" --pattern "${asset}.sig" --dir npm-package/vendor --clobber
            mv "npm-package/vendor/${asset}" "npm-package/vendor/${bundled}"
            mv "npm-package/vendor/${asset}.sig" "npm-package/vendor/${bundled}.sig"
          done
          staged=$(ls npm-package/vendor | wc -l)
          test "$staged" -eq 8 || {
            echo "expected 8 vendor files, found ${staged}" >&2
            exit 1
          }
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish proofboard-cli
        working-directory: npm-package
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is not configured; skipping npm publication."
            exit 0
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
